<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1a1a1a;background:#fff;line-height:1.6}
a{color:inherit;text-decoration:none}
header{text-align:center;padding:48px 20px 8px}
header .site-title{font-size:15px;letter-spacing:.45em;text-transform:uppercase;font-weight:600}
nav{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;padding:20px 12px 28px;border-bottom:1px solid #eee}
nav a{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#555}
nav a:hover,nav a.active{color:#000}
main{max-width:1180px;margin:0 auto;padding:40px 20px 70px}
h1{font-size:26px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;text-align:center;margin-bottom:14px}
.sub{text-align:center;color:#666;max-width:640px;margin:0 auto 36px;font-size:15px}
.grid{column-count:3;column-gap:14px}
.grid figure{break-inside:avoid;margin-bottom:14px;cursor:zoom-in}
.grid img{width:100%;height:auto;display:block}
@media(max-width:900px){.grid{column-count:2}}
@media(max-width:540px){.grid{column-count:1}}
.covers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.covers{grid-template-columns:1fr}}
.cover{position:relative;display:block}
.cover img{width:100%;height:auto;display:block}
.cover span{position:absolute;left:0;right:0;bottom:0;padding:42px 18px 14px;color:#fff;font-size:13px;letter-spacing:.3em;text-transform:uppercase;background:linear-gradient(transparent,rgba(0,0,0,.55))}
section.copy{max-width:680px;margin:44px auto 0}
section.copy h2{font-size:14px;letter-spacing:.28em;text-transform:uppercase;font-weight:600;margin:30px 0 8px}
section.copy p{color:#444;font-size:15px;margin-bottom:10px}
.inquiries{text-align:center;margin-top:56px;padding-top:36px;border-top:1px solid #eee}
.inquiries h2{font-size:14px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:8px}
.inquiries p{color:#666;margin-bottom:16px}
.btn{display:inline-block;border:1px solid #1a1a1a;padding:11px 30px;font-size:12px;letter-spacing:.25em;text-transform:uppercase}
.btn:hover{background:#1a1a1a;color:#fff}
.about-wrap{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:44px;align-items:start;max-width:980px;margin:0 auto}
@media(max-width:760px){.about-wrap{grid-template-columns:1fr}}
.about-wrap img{width:100%;height:auto;display:block}
footer{text-align:center;padding:30px 16px 40px;border-top:1px solid #eee;color:#777;font-size:13px;letter-spacing:.08em}
footer a{text-decoration:underline}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lightbox.open{display:flex}
#lightbox img{max-width:94vw;max-height:94vh;width:auto;height:auto}
</style></head>

<script>
document.querySelectorAll('.grid figure img').forEach(function(im){
  im.addEventListener('click',function(){
